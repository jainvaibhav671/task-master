# Full stack: Postgres, Redis, MinIO (S3-compatible storage), two API replicas
# behind nginx. `docker compose up -d postgres redis minio` starts just the
# dependencies for local development and tests.
services:
  postgres:
    image: docker.io/library/postgres:17-alpine
    environment:
      POSTGRES_USER: taskmaster
      POSTGRES_PASSWORD: taskmaster
      POSTGRES_DB: taskmaster
    ports: ["55432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskmaster"]
      interval: 2s
      retries: 30

  redis:
    image: docker.io/library/redis:7-alpine
    ports: ["56379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30

  minio:
    image: docker.io/minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: taskmaster
      MINIO_ROOT_PASSWORD: taskmaster-secret
    ports: ["59000:9000", "59001:9001"]
    volumes: [miniodata:/data]

  migrate:
    build: .
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://taskmaster:taskmaster@postgres:5432/taskmaster
    depends_on:
      postgres: { condition: service_healthy }

  api1: &api
    build: .
    environment: &apienv
      NODE_ENV: production
      INSTANCE_ID: api1
      DATABASE_URL: postgresql://taskmaster:taskmaster@postgres:5432/taskmaster?connection_limit=10
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-compose-demo-secret-change-me}
      STORAGE_DRIVER: s3
      S3_BUCKET: task-attachments
      S3_ENDPOINT: http://minio:9000
      # Presigned download links must use an address the client can reach.
      S3_PUBLIC_ENDPOINT: http://localhost:59000
      S3_FORCE_PATH_STYLE: "true"
      S3_REGION: us-east-1
      S3_CREATE_BUCKET: "true"
      AWS_ACCESS_KEY_ID: taskmaster
      AWS_SECRET_ACCESS_KEY: taskmaster-secret
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      minio: { condition: service_started }

  api2:
    <<: *api
    environment:
      <<: *apienv
      INSTANCE_ID: api2

  lb:
    image: docker.io/library/nginx:alpine
    ports: ["8080:80"]
    volumes: ["./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [api1, api2]

volumes:
  pgdata:
  miniodata:
